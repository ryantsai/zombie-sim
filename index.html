<!DOCTYPE html>
<html lang="zh-tw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>火柴三國 — Matchstick Three Kingdoms</title>
<style>
  /* Brush-kai. Over http this rule loads the subset directly; on file:// the
     CORS-mode font fetch is refused and js/fonts/font.js loads the same bytes
     from a data: URI instead. Either way the stack below is the fallback. */
  @font-face{
    font-family:"LXGW WenKai TC";
    src:url("fonts/lxgw-wenkai-tc.subset.woff2") format("woff2");
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }

  :root{
    --paper:#f3edde;
    --page:#efe8d8;
    --ink:#3d342b;
    --ink-soft:rgba(61,52,43,0.5);
    --ink-faint:rgba(61,52,43,0.16);
    --kai:"LXGW WenKai TC","LXGW WenKai","DFKai-SB","BiauKai","Kaiti TC",KaiTi,STKaiti,serif;
  }

  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--page);}
  #c{display:block;position:absolute;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;}

  #ui{
    position:absolute;inset:0;
    display:flex;align-items:flex-start;justify-content:center;
    pointer-events:none;
    font-family:var(--kai);
    color:var(--ink);
  }
  #ui .panel{
    display:none;
    pointer-events:auto;
    margin-top:min(54vh,calc(34vh + 190px));
    width:min(420px,80vw);
    max-height:44vh;
    overflow-x:hidden;
    overflow-y:auto;
    flex-direction:column;
    gap:.5rem;
  }
  #ui .panel.on{display:flex;}

  #ui h2{margin:0 0 .2rem;font-size:1.35rem;font-weight:400;letter-spacing:.06em;}
  #ui h3{margin:.6rem 0 .1rem;font-size:.95rem;font-weight:400;color:var(--ink-soft);letter-spacing:.06em;}
  #ui p{margin:0 0 .4rem;line-height:1.7;color:var(--ink-soft);font-size:.95rem;}

  .mbtn{
    font:inherit;font-size:1.15rem;letter-spacing:.12em;
    color:var(--ink);background:transparent;
    border:none;border-bottom:1.5px solid var(--ink-faint);
    padding:.45rem .2rem;cursor:pointer;text-align:left;
    transition:border-color .15s,transform .12s;
  }
  .mbtn:hover,.mbtn:focus-visible{border-bottom-color:var(--ink);transform:translateX(3px);outline:none;}
  .mbtn.primary{font-size:1.3rem;}

  .row{display:flex;align-items:center;gap:.6rem;font-size:.95rem;color:var(--ink-soft);}
  .row.slider span{min-width:4.5rem;}
  .row.slider input{flex:1;accent-color:#8a6a4a;}
  .row.toggle{gap:.45rem;margin-top:.4rem;}

  .chip{
    font:inherit;font-size:.95rem;color:var(--ink-soft);
    background:transparent;border:1.2px solid var(--ink-faint);border-radius:2px;
    padding:.25rem .7rem;cursor:pointer;
  }
  .chip.on{color:var(--ink);border-color:var(--ink);}

  .slots{display:flex;flex-direction:column;gap:.35rem;}
  .slot-row{display:flex;align-items:stretch;gap:.3rem;}
  .slot{
    flex:1;font:inherit;text-align:left;cursor:pointer;
    background:transparent;border:1.2px solid var(--ink-faint);border-radius:2px;
    padding:.4rem .6rem;color:var(--ink);
    display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;
  }
  .slot:hover{border-color:var(--ink);}
  .slot-meta{font-size:.8rem;color:var(--ink-soft);}
  .slot-del{
    font:inherit;cursor:pointer;color:var(--ink-soft);
    background:transparent;border:1.2px solid var(--ink-faint);border-radius:2px;
    padding:0 .55rem;
  }
  .slot-del:hover{color:#963629;border-color:#963629;}
  .empty{font-size:.9rem;}

  .facts{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;margin:.4rem 0 .8rem;font-size:.85rem;}
  .facts dt{color:var(--ink-soft);}
  .facts dd{margin:0;}

  /* Battle chrome: the canvas is the battle, this is the little that isn't */
  .battlebar{
    position:absolute;top:0;right:0;
    display:none;gap:.4rem;align-items:center;
    padding:.7rem 1rem;pointer-events:auto;
  }
  .battlebar.on{display:flex;}
  .mbtn.small{font-size:.95rem;letter-spacing:.08em;padding:.25rem .6rem;border-bottom-width:1.2px;}
  #ui.in-battle{align-items:stretch;}

  .battle-info{
    position:absolute;
    left:max(.8rem,env(safe-area-inset-left));
    bottom:max(.8rem,env(safe-area-inset-bottom));
    display:none;
    box-sizing:border-box;
    width:min(460px,calc(100vw - 1.6rem));
    padding:.7rem .85rem .65rem;
    background:rgba(243,237,222,.94);
    border:1.2px solid var(--ink-faint);
    border-radius:2px;
    pointer-events:none;
  }
  .battle-info.on{display:block;}
  .battle-info-title{
    margin-bottom:.28rem;
    font-size:1.1rem;
    letter-spacing:.1em;
    color:var(--ink);
  }
  .battle-info-line{font-size:.84rem;line-height:1.5;color:var(--ink);}
  .battle-info-line.faint{margin-top:.12rem;color:var(--ink-soft);}
  .battle-abilities{
    position:absolute;
    right:max(.8rem,env(safe-area-inset-right));
    bottom:max(.8rem,env(safe-area-inset-bottom));
    display:none;flex-wrap:wrap;justify-content:flex-end;gap:.3rem;
    max-width:min(620px,calc(100vw - 2rem));pointer-events:auto;
  }
  .battle-abilities.on{display:flex;}
  .ability-chip{background:rgba(243,237,222,.94);}
  .ability-chip:disabled{opacity:.4;cursor:default;}
  .ability-chip.on{color:#963629;border-color:#963629;}

  @media (max-width:600px){
    .battle-info{right:.6rem;left:.6rem;bottom:max(.55rem,env(safe-area-inset-bottom));width:auto;padding:.55rem .7rem;}
    .battle-info-title{font-size:1rem;}
    .battle-info-line{font-size:.76rem;}
    .battle-abilities{right:.6rem;bottom:calc(max(.55rem,env(safe-area-inset-bottom)) + 8.4rem);}
    .ability-chip{font-size:.76rem;padding:.2rem .45rem;}
  }

  /* Campaign chrome: the map is the canvas, this is the little that isn't */
  .camp-bar{
    position:absolute;top:0;left:0;right:0;
    display:none;flex-wrap:wrap;gap:.15rem 1rem;align-items:baseline;
    padding:.55rem 1rem;pointer-events:auto;
    background:linear-gradient(var(--paper) 70%,rgba(243,237,222,0));
  }
  .camp-bar.on{display:flex;}
  .cb-date{font-size:1.05rem;letter-spacing:.08em;}
  .cb-faction{font-size:1.05rem;letter-spacing:.1em;color:var(--ink-soft);}
  .cb-stat{font-size:.85rem;color:var(--ink-soft);}
  .camp-bar .mbtn.small{margin-left:auto;}
  .camp-bar .mbtn.small+.mbtn.small{margin-left:0;}

  .camp-panel{
    position:absolute;
    top:3.4rem;right:max(.8rem,env(safe-area-inset-right));
    display:none;box-sizing:border-box;
    width:min(320px,calc(100vw - 1.6rem));
    max-height:calc(100vh - 6rem);overflow-y:auto;
    padding:.7rem .85rem;
    background:rgba(243,237,222,.94);
    border:1.2px solid var(--ink-faint);border-radius:2px;
    pointer-events:auto;
  }
  .camp-panel.on{display:block;}
  .camp-panel .faint{font-size:.85rem;color:var(--ink-soft);}
  .cblock+.cblock{margin-top:.8rem;padding-top:.7rem;border-top:1.2px solid var(--ink-faint);}
  .ctitle{margin:0 0 .1rem;font-size:1.1rem;font-weight:400;letter-spacing:.08em;}
  .csub{margin-bottom:.4rem;font-size:.78rem;color:var(--ink-soft);}
  .cr{display:flex;justify-content:space-between;gap:.8rem;font-size:.82rem;line-height:1.6;}
  .cr .ck{color:var(--ink-soft);}
  .cr.gen .ck{color:var(--ink);}
  .cr.gen .cv{color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .cr .cv{text-align:right;}
  .clabel{margin:.55rem 0 .25rem;font-size:.76rem;color:var(--ink-soft);letter-spacing:.08em;}
  .cgrid{display:flex;flex-wrap:wrap;gap:.3rem;}
  .crow{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;}
  .cchip{
    font:inherit;font-size:.78rem;color:var(--ink);
    background:transparent;border:1.2px solid var(--ink-faint);border-radius:2px;
    padding:.22rem .55rem;cursor:pointer;
  }
  .cchip:hover:not(:disabled){border-color:var(--ink);}
  .cchip:disabled{opacity:.4;cursor:default;}
  .cnum{
    font:inherit;font-size:.85rem;width:5.2rem;color:var(--ink);
    background:transparent;border:1.2px solid var(--ink-faint);border-radius:2px;padding:.2rem .35rem;
  }
  .carmies{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem;}
  .carmy{
    font:inherit;font-size:.78rem;color:var(--ink);
    background:transparent;border:1.2px solid var(--ink-faint);border-radius:2px;
    padding:.2rem .5rem;cursor:pointer;
  }
  .carmy.on{border-color:#963629;color:#963629;}

  .camp-report{
    position:absolute;
    left:max(.8rem,env(safe-area-inset-left));
    bottom:max(.8rem,env(safe-area-inset-bottom));
    display:none;box-sizing:border-box;
    width:min(420px,calc(100vw - 1.6rem));
    padding:.55rem .75rem;
    background:rgba(243,237,222,.94);
    border:1.2px solid var(--ink-faint);border-radius:2px;
    pointer-events:none;
  }
  .camp-report.on{display:block;}
  .rep-title{font-size:.9rem;letter-spacing:.08em;margin-bottom:.2rem;}
  .rep-line{font-size:.8rem;line-height:1.55;color:var(--ink-soft);}
  .camp-encounter{
    position:absolute;z-index:5;
    margin-top:min(22vh,10rem) !important;
    box-sizing:border-box;width:min(520px,calc(100vw - 2rem)) !important;
    max-height:calc(100vh - 3rem) !important;
    padding:1rem 1.15rem;
    background:rgba(243,237,222,.97);
    border:1.5px solid var(--ink-faint);border-radius:2px;
    box-shadow:0 12px 40px rgba(61,52,43,.12);
  }
  .camp-encounter p{font-size:1rem !important;}
  .enc-actions{display:flex;flex-direction:column;gap:.2rem;}

  .camp-pick{max-height:56vh;}
  .pick-list{display:flex;flex-direction:column;gap:.3rem;}
  .pick-card{
    font:inherit;text-align:left;cursor:pointer;color:var(--ink);
    background:transparent;border:1.2px solid var(--ink-faint);
    border-left-width:4px;border-left-style:solid;border-radius:2px;
    padding:.4rem .6rem;display:flex;flex-direction:column;gap:.1rem;
  }
  .pick-card:hover,.pick-card:focus-visible{border-top-color:var(--ink);border-right-color:var(--ink);border-bottom-color:var(--ink);outline:none;}
  .pick-name{font-size:1.05rem;letter-spacing:.1em;}
  .pick-meta{font-size:.76rem;color:var(--ink-soft);}

  @media (max-width:600px){
    .camp-panel{top:auto;bottom:max(.6rem,env(safe-area-inset-bottom));left:.6rem;right:.6rem;width:auto;max-height:42vh;}
    .camp-report{display:none !important;}
  }

  .toast{
    position:absolute;left:50%;bottom:6vh;transform:translateX(-50%) translateY(6px);
    background:var(--paper);border:1.2px solid var(--ink-faint);
    padding:.4rem .9rem;font-size:.9rem;color:var(--ink);
    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>

<!-- sketch primitives (shared core, untouched) -->
<script src="js/sketch.js"></script>
<!-- boiling canvas type -->
<script src="js/text.js"></script>
<!-- persistence seam: contract, backends -->
<script src="js/store/store.js"></script>
<script src="js/store/local.js"></script>
<script src="js/store/remote.js"></script>
<!-- identity (Stage 1: anonymous deviceId) -->
<script src="js/auth/auth.js"></script>
<!-- schema, migrations, capture/apply -->
<script src="js/save/save-manager.js"></script>
<!-- localization: zh-tw default, en fallback -->
<script src="js/i18n/i18n.js"></script>
<script src="js/i18n/zh-tw.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/battle-barks.js"></script>
<!-- immutable campaign content: skill definitions + 200-general almanac -->
<script src="js/campaign/data/skills.js"></script>
<script src="js/campaign/data/generals.js"></script>
<script src="js/campaign/data/items.js"></script>
<script src="js/campaign/data/events.js"></script>
<!-- brush-kai subset: generated by tools/subset-font.py; absent until then,
     and a missing file here degrades to the system kai fallback chain -->
<script src="js/fonts/subset-data.js"></script>
<script src="js/fonts/font.js"></script>
<!-- the shared engine core, untouched. ZS_MANUAL_BOOT keeps js/main.js from
     starting a world at load: this page has a MENU before it has a battle, and
     ZS.App decides when ZS.Engine.start() runs -->
<script>var ZS_MANUAL_BOOT = true;</script>
<script src="js/grid.js"></script>
<script src="js/nav.js"></script>
<script src="js/camera.js"></script>
<script src="js/world.js"></script>
<script src="js/buildings.js"></script>
<script src="js/tiles.js"></script>
<script src="js/blocks.js"></script>
<script src="js/stains.js"></script>
<script src="js/agents.js"></script>
<script src="js/sim.js"></script>
<script src="js/draw.js"></script>
<script src="js/sound.js"></script>
<!-- Sanguo art: headshot portraits + environment (rivers, hills, camps…) -->
<script src="js/figure/portrait.js"></script>
<script src="js/art/environment.js"></script>
<script src="js/art/ui.js"></script>
<script src="js/art/flag.js"></script>
<!-- Sanguo audio: procedural music + the one real menu track -->
<script src="js/music/music.js"></script>
<script src="js/music/menu-track-data.js"></script>
<!-- the battle layer -->
<script src="js/figure/figure.js"></script>
<script src="js/battle/flowfield.js"></script>
<script src="js/battle/battlefield.js"></script>
<script src="js/battle/formation.js"></script>
<script src="js/battle/morale.js"></script>
<script src="js/battle/ability.js"></script>
<script src="js/battle/duel.js"></script>
<script src="js/battle/feel.js"></script>
<script src="js/battle/commander-ai.js"></script>
<script src="js/battle/command.js"></script>
<script src="js/scenarios/sanguo.js"></script>
<script src="js/main.js"></script>
<!-- the campaign layer: content first, then the graph, then the rules -->
<script src="js/campaign/data/provinces.js"></script>
<script src="js/campaign/data/factions.js"></script>
<script src="js/campaign/general.js"></script>
<script src="js/campaign/roster.js"></script>
<script src="js/campaign/map.js"></script>
<script src="js/campaign/army.js"></script>
<script src="js/campaign/logistics.js"></script>
<script src="js/campaign/victory.js"></script>
<script src="js/campaign/campaign.js"></script>
<script src="js/campaign/events.js"></script>
<script src="js/campaign/politics.js"></script>
<script src="js/campaign/autoresolve.js"></script>
<script src="js/campaign/handoff.js"></script>
<script src="js/campaign/doctrine.js"></script>
<script src="js/campaign/ai.js"></script>
<script src="js/campaign/turn.js"></script>
<script src="js/campaign/view.js"></script>
<!-- shell -->
<script src="js/ui/menu.js"></script>
<script src="js/ui/campaign.js"></script>
<script src="js/app.js"></script>
<script>ZS.App.boot();</script>
</body>
</html>
