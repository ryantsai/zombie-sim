<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>The Hold — a sketch sim</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #efe8d8;
        transition: background 2.5s;
      }
      #c {
        display: block;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* the scrap panel — a paper chip, top-left */
      #ui {
        position: fixed;
        left: 14px;
        top: 14px;
        width: 234px;
        box-sizing: border-box;
        z-index: 5;
        background: #f6f1e3;
        border: 1.6px solid rgba(60, 50, 40, 0.55);
        border-radius: 6px;
        padding: 10px 12px 12px;
        font:
          17px "Segoe Script",
          "Bradley Hand",
          "Comic Sans MS",
          cursive;
        color: #3d342b;
        transform: rotate(-0.35deg);
        user-select: none;
        box-shadow: 2px 3px 0 rgba(60, 50, 40, 0.12);
      }
      #ui .pile {
        font-size: 20px;
        cursor: pointer;
        display: inline-block;
        transition: transform 0.12s;
      }
      #ui .pile.sq {
        transform: scale(0.88) rotate(-2deg);
      }
      #ui .day {
        margin-top: 2px;
        opacity: 0.85;
        font-size: 15px;
      }
      #ui button {
        width: 100%;
        margin-top: 8px;
        padding: 3px 0;
        font:
          16px "Segoe Script",
          "Bradley Hand",
          "Comic Sans MS",
          cursive;
        background: rgba(112, 148, 72, 0.16);
        border: 1.4px solid rgba(60, 50, 40, 0.55);
        border-radius: 5px;
        cursor: pointer;
        color: #3d342b;
      }
      #ui button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #ui #core {
        font-size: 14px;
        opacity: 0.75;
        background: rgba(60, 50, 40, 0.06);
      }
      #ui #core:hover {
        opacity: 1;
      }
      #ui #reset {
        font-size: 14px;
        opacity: 0.75;
        background: rgba(160, 64, 48, 0.08);
      }
      #ui #reset:hover {
        opacity: 1;
      }
      #ui #reset.warn {
        opacity: 1;
        background: rgba(160, 64, 48, 0.3);
      }
      #ui .lbl {
        margin-top: 9px;
        font-style: italic;
        opacity: 0.7;
        font-size: 13.5px;
      }
      #ui .lbl .keys {
        float: right;
        font-style: normal;
      }
      #ui .row {
        padding: 1.5px 5px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 15px;
        display: flex;
        justify-content: space-between;
        gap: 4px;
      }
      #ui .row.on {
        background: rgba(112, 148, 72, 0.25);
      }
      #ui .row.lock {
        opacity: 0.45;
      }
      #ui .row .cost.no {
        color: #a04030;
      }
      #ui .row .prod {
        color: #5a7a3a;
        font-size: 13px;
      }
      #ui .hint {
        margin-top: 9px;
        font-size: 12px;
        opacity: 0.55;
        line-height: 1.5;
      }
      #ui .toast {
        margin-top: 6px;
        font-size: 13.5px;
        min-height: 17px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui"></div>
    <script>
      var ZS_WW = 1600;
      var ZS_WH = 1200;
      var ZS_SCEN = "ScenarioHold";
    </script>
    <script src="js/sketch.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/world.js"></script>
    <script src="js/buildings.js"></script>
    <script src="js/stains.js"></script>
    <script src="js/tiles.js"></script>
    <script src="js/blocks.js"></script>
    <script src="js/agents.js"></script>
    <script src="js/sim.js"></script>
    <script src="js/scenarios/hold.js"></script>
    <script src="js/draw.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
